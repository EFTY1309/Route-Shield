services:
  - type: web
    name: route-shield-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URL
        sync: false # set manually in Render dashboard
      - key: GRAPHHOPPER_API_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false
